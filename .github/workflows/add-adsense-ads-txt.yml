name: Add AdSense ads.txt verification line

on:
  push:
    paths:
      - '.github/workflows/add-adsense-ads-txt.yml'

permissions:
  contents: write

jobs:
  update-ads-txt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add AdSense verification line and remove temporary workflow
        run: |
          LINE='google.com, pub-1559302511010806, DIRECT, f08c47fec0942fa0'
          grep -Fqx "$LINE" ads.txt || printf '\n%s\n' "$LINE" >> ads.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ads.txt
          git rm .github/workflows/add-adsense-ads-txt.yml
          git commit -m 'Add AdSense site verification line'
          git push
