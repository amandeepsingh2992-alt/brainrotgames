name: Game Catalogue Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/provider-health.mjs"
      - "functions/api/games.js"
      - "functions/api/game.js"
      - ".github/workflows/game-qa.yml"

permissions:
  contents: write

concurrency:
  group: game-catalogue-health
  cancel-in-progress: true

jobs:
  provider-health:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Run complete GamePix provider health scan
        run: node scripts/provider-health.mjs
        env:
          MAX_PAGES: 100
          CONCURRENCY: 25
          TIMEOUT_MS: 6000
          MIN_SCANNED: 1000

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: game-catalogue-health
          path: qa-results/provider-health.json
          retention-days: 30

      - name: Commit only definite quarantines
        run: |
          if git diff --quiet -- functions/api/games.js functions/api/game.js; then
            echo "No catalogue quarantine changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/games.js functions/api/game.js
          git commit -m "Auto-quarantine unavailable games"
          git push
