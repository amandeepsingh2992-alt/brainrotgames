name: Original Games Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  original-games-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check original product structure
        run: node scripts/site-structure-qa.mjs
      - name: Check source, HTML, routing and security safeguards
        run: node scripts/full-site-qa.mjs
