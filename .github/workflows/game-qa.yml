name: Game Catalogue Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.json"
      - "robots.txt"
      - "ads.txt"
      - "_headers"
      - "_redirects"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: game-catalogue-health
  cancel-in-progress: true

jobs:
  static-and-provider:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run A-Z source, HTML, routing and security QA
        run: node scripts/full-site-qa.mjs

      - name: Install local integration test tools
        run: npm install --no-save --no-package-lock playwright@1.63.0 wrangler@4.135.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete GamePix provider health scan
        run: node scripts/provider-health.mjs
        env:
          MAX_PAGES: 100
          CONCURRENCY: 25
          TIMEOUT_MS: 6000
          MIN_SCANNED: 1000

      - name: Start local Cloudflare Pages runtime
        run: |
          nohup npx wrangler pages dev . --port 8788 --ip 127.0.0.1 > /tmp/brainrot-wrangler.log 2>&1 &
          echo $! > /tmp/brainrot-wrangler.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then
              echo "Local Pages runtime is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/brainrot-wrangler.log
          exit 1

      - name: Run end-to-end local route and gameplay QA
        env:
          BASE_URL: http://127.0.0.1:8788
          BROWSER_SAMPLE: 30
          BROWSER_IDS: MI991T
          CONCURRENCY: 12
          RETRIES: 2
          LOAD_WAIT: 3000
          GAME_TIMEOUT: 10000
        run: node scripts/game-qa.mjs

      - name: Stop local Cloudflare Pages runtime
        if: always()
        run: |
          if [ -f /tmp/brainrot-wrangler.pid ]; then
            kill $(cat /tmp/brainrot-wrangler.pid) || true
          fi
          cat /tmp/brainrot-wrangler.log || true

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: game-catalogue-health
          path: qa-results/
          retention-days: 30

      - name: Commit only definite quarantines
        run: |
          if git diff --quiet -- functions/api/games.js functions/api/game.js functions/lib/gamepix.js; then
            echo "No catalogue quarantine changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/games.js functions/api/game.js functions/lib/gamepix.js
          git commit -m "Auto-quarantine unavailable games"
          git push
