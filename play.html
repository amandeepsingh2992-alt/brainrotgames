<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Play free browser games on BrainrotGames.">
  <title>Play Game — BrainrotGames</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .player-page{min-height:calc(100vh - 72px);padding:28px 0 50px}
    .player-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
    .back{color:var(--muted)}
    .back:hover{color:#fff}
    .player-shell{background:#000;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .player-frame{width:100%;height:min(72vh,720px);border:0;display:block}
    .player-info{padding:20px 4px}
    .player-title{font-size:30px;font-weight:850;margin:0 0 8px}
    .player-note{color:var(--muted);margin:0}
    .error{padding:80px 20px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="/"><span class="brand-mark">BG</span><span>Brainrot<span>Games</span></span></a>
    <nav><a href="/">Home</a><a href="/#games">Games</a><a href="/#categories">Categories</a></nav>
  </div>
</header>
<main class="container player-page">
  <div class="player-top">
    <a class="back" href="/">← Back to games</a>
    <a class="cta secondary" href="/" style="padding:9px 13px">More games</a>
  </div>
  <div id="content"><div class="error">Loading game…</div></div>
</main>
<script>
const qs = new URLSearchParams(location.search);
const id = qs.get("id");
const title = (qs.get("title") || "game").replace(/-/g," ");
async function start(){
  if(!id){document.getElementById("content").innerHTML='<div class="error">Game not found.</div>';return;}
  try{
    const r=await fetch('/api/game?id='+encodeURIComponent(id),{headers:{Accept:'application/json'}});
    if(!r.ok) throw new Error();
    const g=await r.json();
    document.title=(g.title||title)+" — BrainrotGames";
    if(!g.url) throw new Error();
    document.getElementById("content").innerHTML=`
      <div class="player-shell">
        <iframe class="player-frame" src="${String(g.url).replace(/"/g,'&quot;')}" title="${String(g.title||title).replace(/"/g,'&quot;')}" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="player-info"><h1 class="player-title">${g.title||title}</h1><p class="player-note">${g.category||"Browser game"} • Play instantly in your browser.</p></div>`;
  }catch(e){
    document.getElementById("content").innerHTML='<div class="error">This game could not be loaded right now. <br><br><a class="cta" href="/">Return to games</a></div>';
  }
}
start();
</script>
</body>
</html>
