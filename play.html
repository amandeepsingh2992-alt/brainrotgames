<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" id="meta-description"
        content="Play free browser games on BrainrotGames. Discover casual, arcade, puzzle, strategy and other online games.">

  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#111827">

  <title>Play Game - BrainrotGames</title>

  <link rel="canonical" id="canonical-url" href="https://brainrotgames.me/play.html">

  <link rel="stylesheet" href="/styles.css">

  <style>
    .player-page {
      min-height: calc(100vh - 72px);
      padding: 28px 0 70px;
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .back {
      color: var(--muted);
      text-decoration: none;
    }

    .back:hover {
      color: #fff;
    }

    .player-shell {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .player-frame {
      width: 100%;
      min-height: min(72vh, 720px);
      border: 0;
      display: block;
      background: #000;
    }

    .player-info {
      padding: 24px;
    }

    .player-title {
      font-size: 30px;
      font-weight: 850;
      margin: 0 0 8px;
    }

    .player-note {
      color: var(--muted);
      margin: 0;
    }

    .game-content {
      margin-top: 28px;
      padding: 30px;
      background: rgba(255,255,255,.025);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .game-content h2 {
      margin: 0 0 14px;
      font-size: 24px;
    }

    .game-content h3 {
      margin: 28px 0 10px;
      font-size: 19px;
    }

    .game-content p {
      color: var(--muted);
      line-height: 1.75;
      margin: 0 0 14px;
    }

    .game-content ul {
      color: var(--muted);
      line-height: 1.8;
      padding-left: 22px;
    }

    .game-details {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .detail-card {
      padding: 16px;
      border-radius: 12px;
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border);
    }

    .detail-label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-weight: 700;
    }

    .disclaimer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
    }

    .error {
      padding: 80px 20px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .player-page {
        padding: 20px 0 50px;
      }

      .player-frame {
        min-height: 65vh;
      }

      .player-info {
        padding: 20px;
      }

      .player-title {
        font-size: 24px;
      }

      .game-content {
        padding: 22px;
      }

      .game-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="container nav">

    <a class="brand" href="/" aria-label="BrainrotGames home">
      <span class="brand-mark">BG</span>
      <span>Brainrot<span>Games</span></span>
    </a>

    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/#games">Games</a>
      <a href="/#categories">Categories</a>
    </nav>

  </div>
</header>


<main class="container player-page">

  <div class="player-top">
    <a class="back" href="/">← Back to games</a>

    <a class="cta secondary" href="/#games">
      More games
    </a>
  </div>


  <div id="content">
    <div class="error">Loading game...</div>
  </div>

</main>


<footer class="site-footer">
  <div class="container footer-inner">

    <div class="footer-brand">
      <strong>BrainrotGames</strong>
      <span>Free browser games, available to play online.</span>
    </div>

    <nav class="footer-links" aria-label="Footer navigation">
      <a href="/about">About Us</a>
      <a href="/contact">Contact Us</a>
      <a href="/privacy">Privacy Policy</a>
      <a href="/cookies">Cookie Policy</a>
      <a href="/terms">Terms of Service</a>
    </nav>

    <div class="footer-copy">
      © 2026 BrainrotGames. All rights reserved.
    </div>

  </div>
</footer>


<script>
  const qs = new URLSearchParams(location.search);

  const id = qs.get("id");
  const requestedTitle = qs.get("title") || "Game";

  const content = document.getElementById("content");
  const metaDescription = document.getElementById("meta-description");
  const canonicalUrl = document.getElementById("canonical-url");


  function escapeHtml(value = "") {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[char]));
  }


  function cleanText(value = "") {
    return String(value)
      .replace(/<[^>]*>/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }


  function categoryInstructions(category) {

    const c = String(category || "").toLowerCase();

    if (c.includes("puzzle")) {
      return `
        <p>
          Take your time, study the game board and look for patterns or
          solutions. Puzzle games often reward careful observation and
          logical thinking rather than speed.
        </p>
      `;
    }

    if (c.includes("racing")) {
      return `
        <p>
          Use the available steering and movement controls to guide your
          vehicle. Focus on timing your turns, avoiding obstacles and
          maintaining control while progressing through the game.
        </p>
      `;
    }

    if (c.includes("sports")) {
      return `
        <p>
          Use the available movement and action controls to participate in
          the game. Timing, positioning and quick reactions are generally
          important when playing sports games.
        </p>
      `;
    }

    if (c.includes("strategy")) {
      return `
        <p>
          Think ahead before making important moves. Pay attention to the
          game objectives, available resources and changing situations as
          you progress.
        </p>
      `;
    }

    if (c.includes("arcade")) {
      return `
        <p>
          Arcade games usually focus on quick reactions, timing and repeated
          attempts. Learn the basic controls first and then try to improve
          your score as you become familiar with the gameplay.
        </p>
      `;
    }

    if (c.includes("fighting")) {
      return `
        <p>
          Learn the movement and action controls before entering difficult
          situations. Timing your attacks, movement and defensive actions
          can make a significant difference during gameplay.
        </p>
      `;
    }

    return `
      <p>
        Start by learning the available controls and understanding the main
        objective of the game. Follow the instructions provided inside the
        game and experiment with the controls to become familiar with the
        gameplay.
      </p>
    `;
  }


  async function start() {

    if (!id) {
      content.innerHTML = `
        <div class="error">
          <h1>Game not found</h1>
          <p>Please return to the game library and choose a game.</p>
          <br>
          <a class="cta" href="/">Browse games</a>
        </div>
      `;
      return;
    }


    try {

      const response = await fetch(
        "/api/game?id=" + encodeURIComponent(id),
        {
          headers: {
            Accept: "application/json"
          }
        }
      );


      if (!response.ok) {
        throw new Error("Game request failed");
      }


      const game = await response.json();

      const title = cleanText(game.title || requestedTitle || "Game");
      const category = cleanText(game.category || "Browser Game");
      const description = cleanText(game.description || "");


      if (!game.url) {
        throw new Error("Game URL unavailable");
      }


      document.title = "Play " + title + " Free Online - BrainrotGames";


      const pageDescription =
        description ||
        "Play " + title +
        " free online on BrainrotGames. Discover browser games across " +
        category.toLowerCase() +
        " and other popular categories.";


      metaDescription.setAttribute(
        "content",
        pageDescription.substring(0, 160)
      );


      canonicalUrl.setAttribute(
        "href",
        "https://brainrotgames.me/play.html?id=" +
        encodeURIComponent(id)
      );


      const safeUrl = escapeHtml(game.url);
      const safeTitle = escapeHtml(title);
      const safeCategory = escapeHtml(category);
      const safeDescription = escapeHtml(description);


      content.innerHTML = `

        <div class="player-shell">

          <iframe
  class="player-frame"
  src="${safeUrl}"
  title="${safeTitle}"
  allow="fullscreen; autoplay"
  loading="eager">
</iframe>

          <div class="player-info">

            <h1 class="player-title">
              ${safeTitle}
            </h1>

            <p class="player-note">
              ${safeCategory} • Play free online in your browser.
            </p>

          </div>

        </div>


        <section class="game-content">

          <h2>About ${safeTitle}</h2>

          ${
            safeDescription
              ? `<p>${safeDescription}</p>`
              : `
                <p>
                  ${safeTitle} is a browser-based game available to play
                  online through BrainrotGames. No separate software
                  installation is required to access the game.
                </p>
              `
          }


          <h3>How to Play</h3>

          ${categoryInstructions(category)}


          <h3>Game Controls</h3>

          <p>
            Controls can vary depending on the game and the device being
            used. Look for the control instructions shown inside the game.
            On desktop devices, many browser games use the keyboard and
            mouse, while supported mobile games may use touch controls.
          </p>


          <h3>Tips for Playing</h3>

          <ul>
            <li>Read any instructions shown when the game starts.</li>
            <li>Take a moment to understand the controls.</li>
            <li>Pay attention to the game's objective and scoring system.</li>
            <li>If the game becomes difficult, try a different strategy or approach.</li>
            <li>Make sure your browser is updated for the best experience.</li>
          </ul>


          <div class="game-details">

            <div class="detail-card">
              <span class="detail-label">Category</span>
              <span class="detail-value">${safeCategory}</span>
            </div>

            <div class="detail-card">
              <span class="detail-label">Platform</span>
              <span class="detail-value">Web Browser</span>
            </div>

            <div class="detail-card">
              <span class="detail-label">Availability</span>
              <span class="detail-value">Free to Play</span>
            </div>

          </div>


          <div class="disclaimer">
            <strong>Game content notice:</strong>
            BrainrotGames provides access to browser games supplied through
            third-party game publishers, distributors and technology
            providers. Game availability, descriptions and gameplay may
            change over time. BrainrotGames does not claim ownership of
            third-party game content unless otherwise stated.
          </div>

        </section>
      `;

    } catch (error) {

      console.error(error);

      content.innerHTML = `
        <div class="error">

          <h1>This game could not be loaded</h1>

          <p>
            The game is temporarily unavailable. Please try again later
            or choose another game from our library.
          </p>

          <br>

          <a class="cta" href="/">
            Browse games
          </a>

        </div>
      `;
    }
  }


  start();
</script>

</body>
</html>
